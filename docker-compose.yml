services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: today-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-today}
      MYSQL_USER: ${MYSQL_USER:-today}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-today}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - today-mysql-data:/var/lib/mysql
      - ./apps/api/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "-h127.0.0.1",
          "-u${MYSQL_USER:-today}",
          "-p${MYSQL_PASSWORD:-today}",
          "-e",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qdrant:
    # 国内拉取 Docker Hub 困难时，在 .env 设置：
    # QDRANT_IMAGE=docker.m.daocloud.io/qdrant/qdrant:v1.18.3
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.3}
    container_name: today-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - today-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:17-jre-jammy}
    image: today-api:local
    container_name: today-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_TCP_PORT: "3306"
      MYSQL_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-today}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
      MYSQL_USER: ${MYSQL_USER:-today}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-today}
      TODAY_JWT_SECRET: ${TODAY_JWT_SECRET:-today-dev-jwt-secret-change-me-please-32bytes}
      TODAY_VECTOR_PROVIDER: ${TODAY_VECTOR_PROVIDER:-mysql}
      TODAY_QDRANT_URL: http://qdrant:6333
      TODAY_QDRANT_COLLECTION: ${TODAY_QDRANT_COLLECTION:-today_memories}
      TODAY_VECTOR_ADMIN_TOKEN: ${TODAY_VECTOR_ADMIN_TOKEN:-}
      TODAY_AI_ADMIN_TOKEN: ${TODAY_AI_ADMIN_TOKEN:-}
      TODAY_AI_ASYNC_CHECKIN: ${TODAY_AI_ASYNC_CHECKIN:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    image: today-web:local
    container_name: today-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  today-mysql-data:
  today-qdrant-data:
