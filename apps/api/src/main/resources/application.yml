server:
  port: ${PORT:3001}

spring:
  application:
    name: today-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/today?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_USER:today}
    password: ${MYSQL_PASSWORD:today}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.today.persistence
  configuration:
    map-underscore-to-camel-case: true

today:
  jwt:
    secret: ${TODAY_JWT_SECRET:today-dev-jwt-secret-change-me-please-32bytes}
    expire-hours: ${TODAY_JWT_EXPIRE_HOURS:168}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    timeout-ms: ${OPENAI_TIMEOUT_MS:30000}
    json-response-format: ${OPENAI_JSON_RESPONSE_FORMAT:true}
    temperature: ${OPENAI_TEMPERATURE:0.3}
    retrieve-top-k: ${OPENAI_RETRIEVE_TOP_K:5}
    async-checkin: ${TODAY_AI_ASYNC_CHECKIN:true}
